<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./thermometer-svgrepo-com.svg" type="image/svg+xml">
    <title>Temperature Converter</title>
</head>

<body>


    <div id="temperature-converter-container">
        <h1 id="temperature-converter-title">Temperature Converter</h1>

        <p id="conversion-direction"></p>
        <input type="number" placeholder="" id="temperature-input">
        <p id="result-temperature"></p>
        <div id="temperature-buttons">
            <button type="button" id="convert-btn">Convert</button>
            <button type="button" id="reset-btn">Reset</button>
            <button type="button" id="change-btn">Change</button>
        </div>

    </div>

    <script src="./script.js"></script>
</body>

</html>
